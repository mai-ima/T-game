で駅長にも一緒に話しましょう。"}],next:"ch1.announce_task"},"ch1.dq_blame":{id:"ch1.dq_blame",type:"line",lines:[{who:"traveler",text:"責任の話はしていません。誰のせいかではなく、次をどうするかを教えてください。",mood:"serious"},{who:"kubota",text:"（険しい表情で一歩前に出る）お客様、失礼しました。次の便をご案内します。"},{who:"kubota",text:"あとで、あなたと話します。",mood:"serious"}],next:"ch1.announce_task"},"ch1.dq_silent":{id:"ch1.dq_silent",type:"line",lines:[{who:"traveler",text:"次の便…分かりました。",mood:"normal"},{who:"kubota",text:"（あなたの顔をちらりと見たが、何も言わなかった）"}],next:"ch1.announce_task"},"ch1.delay_asked":{id:"ch1.delay_asked",type:"line",lines:[{who:"kubota",text:"分かりました。お客様、少しお待ちください。（端末と指令に確認する）"},{who:"hamaguchi",text:"輸送指令の浜口です。第一報は約10分、実際は12分前後になりそうです。確定ではありません。"},{who:"kubota",text:"お客様、見込みでは12分前後です。乗り換えが厳しい可能性があるので、次の便もご案内します。"},{who:"kubota",text:"いまのは、確定と見込みを分けて話す手順です。あなたも、次は自分でやってみましょう。"}],next:"ch1.announce_task",effects:[{set:"ch1.delay_asked_flag"}]},"ch1.delay_late":{id:"ch1.delay_late",type:"line",lines:[{text:"11時を過ぎていた。久保田がすでに改札で旅行客に対応を始めている。",narration:!0},{who:"kubota",text:"遅れて来たのは仕方ありません。次のお客様の対応をお願いします。放送の文面は、あなたが作ってください。",mood:"serious"},{who:"kubota",text:"（手元の端末を見せながら）確定と見込みを分けて、お詫びと案内を含めてください。"}],next:"ch1.announce_task",effects:[{eval:{key:"teamwork",add:1}},{eval:{key:"service",add:-1}},{set:"ch1.delay_late"}]},"ch1.announce_task":{id:"ch1.announce_task",type:"task",kind:"compose",title:"遅延案内放送の作成",intro:"4つの要素から、適切な文を選んでください。",slots:[{id:"apology",label:"お詫び",options:[{id:"a1",text:"お急ぎのところ、ご迷惑をおかけして申し訳ございません。",good:!0,why:"丁寧で簡潔なお詫びです。"},{id:"a2",text:"遅れていますが、ご了承ください。",good:!1,why:"お詫びがなく、お客様への配慮に欠けます。"},{id:"a3",text:"電車の遅れは当駅の責任ではありません。",good:!1,why:"責任の所在を放送で述べる必要はありません。"}]},{id:"cause",label:"状況",options:[{id:"c1",text:"車両の点検のため、遅れが生じております。",good:!0,why:"確認された情報だけを伝えています。"},{id:"c2",text:"信号機の故障のため、遅れております。",good:!1,why:"確認されていない原因を述べるのは誤案内です。"},{id:"c3",text:"原因は分かりません。",good:!1,why:"把握している情報（車両点検）を伝えるべきです。"}]},{id:"estimate",label:"見込み",options:[{id:"e1",text:"現在のところ、約10分から15分の遅れが見込まれます。変更があり次第お知らせします。",good:!0,why:"見込みと更新の予告を分けて }},{eval:{key:"teamwork",add:-1}},{set:"ch1.lunch_alone"}]}]},"ch1.lunch_k":{id:"ch1.lunch_k",type:"line",lines:[{who:"kubota",text:"私が新人のとき、先輩に言われたんです。「仕事は、聞かれる前に報告するほど楽になる」って。実践すると、本当にそうでした。",mood:"smile"}],next:"ch1.lunch_end"},"ch1.lunch_y":{id:"ch1.lunch_y",type:"line",lines:[{who:"yamashina",text:"来週の土曜、青浜総合車両センターで見学会があるんだ。社員向けの公募で。行きたいけど、一人だと気後れして。"},{who:"yamashina",text:"今日の仕事が落ち着いたら、改めて誘うよ。"}],next:"ch1.lunch_end",effects:[{set:"ch1.yama_invite_hint"}]},"ch1.lunch_a":{id:"ch1.lunch_a",type:"line",lines:[{text:"一人でノートを広げ、午前の判断の理由を書き出した。静かな時間が流れた。",narration:!0}],next:"ch1.lunch_end"},"ch1.lunch_end":{id:"ch1.lunch_end",type:"effect",effects:[{set:"ch1.lunch_done"},{time:45},{log:{text:"昼休憩",tag:"work"}}],next:"ch1.hub"},"ch1.yama_ask":{id:"ch1.yama_ask",type:"line",lines:[{who:"yamashina",text:"（駅事務室の前で）あのさ、来週の土曜に青浜の車両基地で見学会があるんだ。社員向けで、1日。一緒に行かないか？",mood:"smile"},{who:"yamashina",text:"返事は終業後でいい。久保田さんにも相談してみて。"}],next:"ch1.hub",effects:[{set:"ch1.yama_invite"},{rel:{char:"yamashina",trust:0,rapport:1}}],view:{mode:"3d",cam:"npc:yamashina",caption:"14:00"}},"ch1.closing":{id:"ch1.closing",type:"line",lines:[{text:"17時。業務の終わりに、駅事務室で白石駅長と久保田が待っていた。",narration:!0}],next:"ch1.closing_b1",view:{mode:"25d",bg:"office",focus:["shiraishi","kubota"],caption:"17:00 駅事務室"},effects:[{clock:{minute:1020}}]},"ch1.closing_b1":{id:"ch1.closing_b1",type:"branch",cases:[{when:{flag:"ch1.admitted_error"},goto:"ch1.cl_admit"},{when:{flag:"ch1.blamed"},goto:"ch1.cl_blame"},{when:{flag:"ch1.silent_error"},goto:"ch1.cl_silent"},{when:{flag:"ch1.delay_verified"},goto:"ch1.cl_careful"}],else:"ch1.cl_generic"},"ch1.cl_admit":{id:"ch1.cl_admit",type:"line",lines:[{who:"shiraishi",text:"久保田から聞いた。案内の誤りは起きる。大事なのは、誤りを自分から報告できたことだ。",mood:"smile"},{who:"kubota",text:"見込みの案内は、次からは「確定ではありません」と一言添えましょう。"}],next:"ch1.closing2",view:{mode:"25d",bg:"office",focus:["shiraishi","kubota"]}},"ch1.cl_blame":{id:"ch1.cl_blame",type:"line",lines:[{who:"shiraishi",text:"今日のことで、一つ話がある。旅行客への対応のことだ。",mood:"serious"},{who:"kubota",text:"運行情報が変わるのは、誰のせいでもありません。でも、その場で責任の話をするのは、お客様の役に立ちません。"},{who:"shiraishi",text:"誰かのせいにしたくなる気持ちは分かる。だが、現場では一度の言い訳が信頼を大きく削る。明日から、報告を意識しよう。"}],next:"ch1.closing2",view:{mode:"25d",bg:"office",focus:["shiraishi","kubota"]}},"ch1.cl_silent":{id:"ch1.cl_silent",type:"line",lines:[{who:"shiraishi",text:"案内の件、記録に目を通した。報告がなかった理由を、聞かせてほしい。",mood:"serious"},{who:"kubota",text:"責めるつもりはありません。ただ、記録と現場の様子が合わないと、次に同じ誤りを防げないんです。"}],next:"ch1.closing2",view:{mode:"25d",bg:"office",focus:["shiraishi","kubota"]}},"ch1.cl_careful":{id:"ch1.cl_careful",type:"line",lines:[{who:"shiraishi",text:"遅延時の対応、確認してから答えたと聞いた。見込みと確定を分けた案内は、お客様の信頼につながる。",mood:"smile"},{who:"kubota",text:"今日の判断、私は好きでしたよ。"}],next:"ch1.closing2",view:{mode:"25d",bg:"office",focus:["shiraishi","kubota"]}},"ch1.cl_generic":{id:"ch1.cl_generic",type:"line",lines:[{who:"shiraishi",text:"初日にしては、よく動いた。細かい点は、久保田から追って共有する。"},{who:"kubota",text:"今日の記録は、私が確認しておきます。"}],next:"ch1.closing2",view:{mode:"25d",bg:"office",focus:["shiraishi","kubota"]}},"ch1.closing2":{id:"ch1.closing2",type:"line",lines:[{who:"shiraishi",text:"評価は、毎日ついて回る。今日の結果は、評価表と勤務記録に残る。異動の話はまだ先だが、評価が土台になる。"},{who:"kubota",text:"ところで週末は、公休です。もし良ければ、券売機と窓口の自主練習を一緒にやりませんか。私も新人のときは、先輩に付き合ってもらいました。"},{who:"yamashina",text:"（部屋に顔を出して）…例の基地見学会、返事を聞いてもいいか？"}],next:"ch1.closing_choice",view:{mode:"25d",bg:"office",focus:["shiraishi","kubota","yamashina"]}},"ch1.closing_choice":{id:"ch1.closing_choice",type:"choice",prompt:"週末の過ごし方を決めよう。",options:[{id:"mentor",label:"久保田さんの自主練習に参加する",goto:"ch1.cc_mentor",tone:"careful",effects:[{set:"legacy.mentor_line"},{rel:{char:"kubota",trust:2,rapport:1}},{skill:{key:"ticket",add:5}},{training:{id:"station_basic",progress:25}},{timeline:{text:"4月3日 久保田の自主練習に参加"}}]},{id:"depot",label:"山科さんと車両基地の見学会に参加する",goto:"ch1.cc_depot",tone:"caring",requires:{flag:"ch1.yama_invite"},effects:[{set:"legacy.depot_tour"},{rel:{char:"yamashina",trust:2,rapport:2}},{skill:{key:"depot",add:4}},{training:{id:"depot_intro",progress:25}},{timeline:{text:"4月10日 車両基地の見学会に参加"}}]},{id:"rest",label:"公休はしっかり休む",goto:"ch1.cc_rest",tone:"neutral",effects:[{set:"legacy.rested"},{eval:{key:"safety",add:2}},{rel:{char:"kubota",trust:0,rapport:0}}]}],important:!0,view:{mode:"25d",bg:"office",focus:["kubota","yamashina"]}},"ch1.cc_mentor":{id:"ch1.cc_mentor",type:"line",lines:[{who:"kubota",text:"決まりですね。土曜は券売機の障害対応を実演しましょう。",mood:"smile"},{who:"yamashina",text:"…そっか。じゃあ、見学会の話は聞かせるよ。"}],next:"ch1.closing3",view:{mode:"25d",bg:"office",focus:["kubota","yamashina"]}},"ch1.cc_depot":{id:"ch1.cc_depot",type:"line",lines:[{who:"yamashina",text:"本当か！ 助かる。集合は朝8時、青浜駅の改札前だ。",mood:"smile"},{who:"kubota",text:"見学は良い経験です。ただ、戻ったら必ず、学んだことを駅の仕事にどう生かすか、聞かせてくださいね。"}],next:"ch1.closing3",view:{mode:"25d",bg:"office",focus:["kubota","yamashina"]}},"ch1.cc_rest":{id:"ch1.cc_rest",type:"line",lines:[{who:"shiraishi",text:"休むのも仕事のうちだ。次の勤務に備えなさい。"},{who:"yamashina",text:"分かった。見学会は、俺一人で行ってくるよ。"}],next:"ch1.closing3",view:{mode:"25d",bg:"office",focus:["shiraishi","yamashina"]}},"ch1.closing3":{id:"ch1.closing3",type:"branch",cases:[{when:{flag:"legacy.wish_depot"},goto:"ch1.wn_depot"},{when:{flag:"legacy.wish_station"},goto:"ch1.wn_station"},{when:{flag:"legacy.wish_planning"},goto:"ch1.wn_plan"}],else:"ch1.wn_open"},"ch1.wn_depot":{id:"ch1.wn_depot",type:"line",lines:[{who:"shiraishi",text:"面談記録を見たよ。車両や設備への関心があるそうだな。基地への異動には、駅務基礎の修了、基地入門の研修、安全・正確さの評価が必要だ。今日の評価と合わせて、足りない点は人事課と見ておくといい。"}],next:"ch1.end",view:{mode:"25d",bg:"office",focus:["shiraishi"]}},"ch1.wn_station":{id:"ch1.wn_station",type:"line",lines:[{who:"shiraishi",text:"駅で接客を極めたいという希望だったな。専門を深める道も立派な進路だ。評価と資格を重ねれば、駅の専門職として任せる仕事も増えていく。"}],next:"ch1.end",view:{mode:"25d",bg:"office",focus:["shiraishi"]}},"ch1.wn_plan":{id:"ch1.wn_plan",type:"line",lines:[{who:"shiraishi",text:"計画の仕事に関心があるそうだな。企画系の部署は、現場経験と報連相の評価が見られる。まずは駅で、お客様と運行の関係を体で覚えなさい。"}],next:"ch1.end",view:{mode:"25d",bg:"office",focus:["shiraishi"]}},"ch1.wn_open":{id:"ch1.wn_open",type:"line",lines:[{who:"shir
